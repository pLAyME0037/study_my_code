name: cloth_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  animated_text_kit: ^4.2.1
  image_picker: ^1.2.2
  firebase_core: ^3.12.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  uuid: ^4.5.3
  staggered_grid_view_flutter: ^0.0.4
  flutter_swiper_null_safety: ^1.0.2
  font_awesome_flutter: ^11.0.0
  provider: ^6.0.2
  badges: ^3.2.0
  sn_progress_dialog: ^1.0.6
  flutter_datetime_picker: ^1.5.1
  cupertino_icons: ^1.0.8
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - images/
    - images/men/
    - images/try/
    - images/inapp/
    - images/women/
    - images/shoes/
    - images/electronics/
    - images/beauty/
    - images/homegarden/
    - images/accessories/
    - images/bags/
    - images/kids/
